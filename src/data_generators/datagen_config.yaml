# =============================================================================
# Data Generation Configuration
# =============================================================================
# This file defines volumes and settings for synthetic data generation.
#
# Environment Variable Support:
#   Values use the format: ${ENV_VAR || default_value}
#   - If ENV_VAR is set, its value is used
#   - Otherwise, default_value is used
#
# Override priority (highest to lowest):
#   1. CLI arguments (--customers=500)
#   2. Environment variables (via ${VAR || default} syntax)
#   3. Default values in this file
#
# Generation rules:
#   - If a value is 0 or missing, that entity is skipped
#   - CLI can override any value
#   - Static dimensions (channels, payment methods, etc.) are always generated
#
# =============================================================================

# -----------------------------------------------------------------------------
# Initial Load - Bulk data generation for fresh warehouse setup
# -----------------------------------------------------------------------------
# Used by: dwh generate-data
initial_load:
  # Dimension counts
  customers: ${DATAGEN_CUSTOMERS || 500}
  products: ${DATAGEN_PRODUCTS || 5000}
  stores: ${DATAGEN_STORES || 10}
  employees: ${DATAGEN_EMPLOYEES || 50}
  promotions: ${DATAGEN_PROMOTIONS || 20}
  
  # Static dimensions (always generated with standard values)
  channels: ${DATAGEN_CHANNELS || 6}
  payment_methods: ${DATAGEN_PAYMENT_METHODS || 10}
  shipping_methods: ${DATAGEN_SHIPPING_METHODS || 8}
  customer_segments: ${DATAGEN_CUSTOMER_SEGMENTS || 7}
  product_categories: ${DATAGEN_PRODUCT_CATEGORIES || 100}
  
  # Fact counts
  # sales: Number of orders (each order has 1-5 line items in bridge_order_items)
  sales: ${DATAGEN_SALES || 10000}
  
  # inventory_snapshots: Days of history (records = products × stores × days)
  # With 5000 products × 10 stores × 365 days = 18.25M records/year
  # Set to 0 to skip - can add later if inventory analytics needed
  inventory_snapshots: ${DATAGEN_INVENTORY_SNAPSHOTS || 0}
  
  # customer_interactions: Website visits, support calls, etc.
  customer_interactions: ${DATAGEN_CUSTOMER_INTERACTIONS || 5000}
  
  # loyalty_transactions: Points earned/redeemed (for loyalty program members)
  loyalty_transactions: ${DATAGEN_LOYALTY_TRANSACTIONS || 3000}
  
  # Date range for historical data
  date_start: ${DATAGEN_DATE_START || 2025-01-01}
  date_end: ${DATAGEN_DATE_END || 2026-01-31}

# -----------------------------------------------------------------------------
# Incremental Settings - Operations and event-driven generation
# -----------------------------------------------------------------------------
# Used by: dwh generate-incremental, dwh generate-store, dwh generate-promotion
#
# IMPORTANT: For incremental generation to work correctly, you must either:
#   1. Run 'dwh cache-keys' first to fetch existing keys from Snowflake, OR
#   2. Run initial load first, then use the same keys_cache for incremental
#
# Without existing keys, orders/interactions will only reference same-day customers.
incremental:
  # Date range for incremental data (entries distributed across this range)
  # CLI can override with --start-date and --end-date
  start_date: ${DATAGEN_START_DATE || 2026-02-01}
  end_date: ${DATAGEN_END_DATE || 2026-02-06}
  
  # Volume counts (distributed across date range)
  new_customers: ${DATAGEN_NEW_CUSTOMERS || 25}
  new_orders: ${DATAGEN_NEW_ORDERS || 50}
  new_interactions: ${DATAGEN_NEW_INTERACTIONS || 50}
  new_loyalty_transactions: ${DATAGEN_NEW_LOYALTY || 50}
  min_items_per_order: ${DATAGEN_MIN_ITEMS_PER_ORDER || 1}
  max_items_per_order: ${DATAGEN_MAX_ITEMS_PER_ORDER || 5}
  existing_customer_ratio: ${DATAGEN_EXISTING_CUSTOMER_RATIO || 0.4}
  
  # Inventory snapshot (generated for end_date only)
  # Set to true to capture point-in-time inventory during incremental
  # Records = products × stores (e.g., 5000 × 10 = 5000 per snapshot)
  # generate_inventory_snapshot: true
  
  # Store opening defaults
  employees_per_store: ${DATAGEN_EMPLOYEES_PER_STORE || 5}
  include_initial_inventory: ${DATAGEN_INCLUDE_INITIAL_INVENTORY || true}
  
  # Promotion campaign defaults
  discount_min: ${DATAGEN_DISCOUNT_MIN || 0.10}
  discount_max: ${DATAGEN_DISCOUNT_MAX || 0.30}

# -----------------------------------------------------------------------------
# Date Range
# -----------------------------------------------------------------------------
# Used for date dimension generation
# IMPORTANT: This range should cover both initial_load and incremental dates
dates:
  start: ${DATAGEN_DATES_START || 2025-01-01}
  end: ${DATAGEN_DATES_END || 2026-12-31}

# -----------------------------------------------------------------------------
# Output Paths
# -----------------------------------------------------------------------------
paths:
  output_dir: ${DATAGEN_OUTPUT_DIR || outputs/initial_data}
  incremental_output_dir: ${DATAGEN_INCREMENTAL_OUTPUT_DIR || outputs/incremental_data}
  keys_cache: ${DATAGEN_KEYS_CACHE || outputs/keys_cache.json}

# -----------------------------------------------------------------------------
# Generation Settings
# -----------------------------------------------------------------------------
settings:
  seed: ${DATAGEN_SEED || 42}
  validate_integrity: ${DATAGEN_VALIDATE_INTEGRITY || true}
  locale: ${DATAGEN_LOCALE || en_US}
