[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce_dwh"
version = "1.0.0"
description = "Programmatic data warehouse setup for e-commerce analytics (Snowflake, PostgreSQL)"
requires-python = ">=3.10"

dependencies = [
    "snowflake-connector-python[pandas]>=3.6.0",
    "pandas>=2.0.0",
    "Faker>=22.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.5.0",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
dwh = "cli.main:cli"

[project.optional-dependencies]
pg = [
    "psycopg2-binary>=2.9.9",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
