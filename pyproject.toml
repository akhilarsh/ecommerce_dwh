[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce_dwh"
version = "1.0.0"
description = "Programmatic data warehouse setup for e-commerce analytics (Snowflake, PostgreSQL, Databricks, BigQuery, Redshift)"
requires-python = ">=3.10"

dependencies = [
    "snowflake-connector-python[pandas]>=3.6.0",
    "pandas>=2.0.0",
    "Faker>=22.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.5.0",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
dwh = "cli.main:cli"

[project.optional-dependencies]
pg = [
    "psycopg2-binary>=2.9.9",
]
databricks = [
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.20.0",
    "pyarrow>=14.0.0",
]
bigquery = [
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-bigquery-storage>=2.24.0",
    "pyarrow>=14.0.0",
    "db-dtypes>=1.2.0",
    # pandas-gbq is not imported directly by our loader (we use the NDJSON
    # `load_table_from_file` path), but google-cloud-bigquery emits a
    # FutureWarning whenever a DataFrame round-trips without it, and future
    # versions will require it for `load_table_from_dataframe`. Pinning here
    # keeps the venv quiet and forward-compatible.
    "pandas-gbq>=0.26.1",
]
redshift = [
    # Amazon's official Python driver — native SUPER serialization, IAM auth,
    # and IDP plugin support. Wire-protocol-compatible with Postgres but the
    # driver layer is not psycopg2.
    "redshift-connector>=2.1.0",
    # boto3 powers both S3 staging upload (COPY-from-S3 path) and the STS
    # calls redshift-connector makes under the hood when iam=True.
    "boto3>=1.34.0",
    "pyarrow>=14.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
